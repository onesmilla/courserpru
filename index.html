<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Данные для руководителя проекта</title>
<style>
:root{
 --ink:#191c22; --mut:#5b6270; --faint:#98a0ae; --line:#e7e9f0; --soft:#f5f6fa;
 --blue:#2f6bd8; --blueBg:#eaf2fe; --amber:#e8930c; --amberBg:#fdf3e0;
 --purple:#8a5cc7; --purpleBg:#f3ecfd; --teal:#0e9bb5; --tealBg:#e4f6fa;
 --green:#1e9e5a; --greenBg:#e8f6ee; --red:#d64541; --redBg:#fdecea;
 --pink:#d64f8e; --pinkBg:#fceaf3; --orange:#e0673a; --orangeBg:#fdeee7;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fbfbfe;line-height:1.55;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.fadein{animation:fadeIn .38s cubic-bezier(.2,.7,.3,1);}
@keyframes popIn{0%{transform:scale(.85);opacity:0;}60%{transform:scale(1.05);opacity:1;}100%{transform:scale(1);}}
.pop{animation:popIn .35s ease;}
@keyframes confettiFall{to{transform:translateY(105vh) rotate(360deg);opacity:.15;}}
.confetti-piece{position:fixed;top:-24px;border-radius:2px;pointer-events:none;z-index:9999;animation:confettiFall linear forwards;}
.xp-pill{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(90deg,#fdf3e0,#fceaf3);border:1px solid #f0d9ab;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:750;color:#a8660a;white-space:nowrap;}
.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.badge{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--soft);border:1.5px solid var(--line);opacity:.32;filter:grayscale(1);transition:all .2s;}
.badge.on{opacity:1;filter:none;box-shadow:0 2px 10px rgba(30,40,80,.16);border-color:transparent;}
.streak-note{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.5;}
/* ---- home hub ---- */
.hero{border-radius:22px;padding:36px 40px;background:linear-gradient(120deg,#eaf2fe 0%,#f3ecfd 55%,#fceaf3 100%);border:1px solid var(--line);position:relative;overflow:hidden;}
.hero-kicker{font-size:13px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--purple);}
.hero h1{margin:10px 0 0;}
.hero p.lead{font-size:17px;color:var(--mut);max-width:680px;margin:14px 0 0;}
.hero-stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap;}
.hero-stat b{display:block;font-size:26px;font-weight:800;}
.hero-stat span{font-size:13px;color:var(--mut);}
.hero-cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.role-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;}
.rm-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.rm-card .rm-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;}
.rm-card b{font-size:15.5px;}
.rm-card p{font-size:14px;color:var(--mut);margin:6px 0 0;}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:18px;}
.mod-card{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:18px 20px;cursor:pointer;transition:transform .15s,box-shadow .15s;font:inherit;color:var(--ink);display:block;width:100%;}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(30,40,80,.1);}
.mod-card .mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.mod-card .mc-num{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 30px;}
.mod-card .mc-state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.mod-card .mc-title{font-size:16px;font-weight:750;margin-top:12px;}
.mod-card .mc-sub{font-size:13.5px;color:var(--faint);margin-top:6px;}
.mod-card .mc-bar{height:5px;border-radius:3px;background:var(--soft);margin-top:14px;overflow:hidden;}
.mod-card .mc-bar i{display:block;height:100%;border-radius:3px;}
/* ---- practice checkbox ---- */
.practice-done{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #f0d9ab;font-size:14.5px;font-weight:650;color:var(--amber);cursor:pointer;}
.practice-done input{width:18px;height:18px;accent-color:var(--green);cursor:pointer;}
.practice-done.done{color:var(--green);}
/* ---- summary tldr ---- */
.tldr{margin-top:18px;background:var(--soft);border-radius:14px;padding:16px 20px;font-size:15px;color:var(--mut);display:flex;gap:12px;}
.tldr .ti{font-size:18px;flex:0 0 auto;}
/* ---- certificate ---- */
.cert-wrap{max-width:900px;}
.cert{margin-top:22px;border-radius:22px;padding:52px 48px;background:radial-gradient(circle at 15% 15%,#f3ecfd,#eaf2fe 45%,#fceaf3 100%);border:2px solid #d9c9f2;text-align:center;position:relative;}
.cert::before{content:"";position:absolute;inset:14px;border:1.5px dashed #c9b4ea;border-radius:14px;pointer-events:none;}
.cert-kicker{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:750;color:var(--purple);}
.cert-name{font-size:clamp(26px,4vw,40px);font-weight:800;margin:16px 0;color:var(--ink);border-bottom:2px solid var(--purple);display:inline-block;padding-bottom:8px;min-width:280px;}
.cert-sub{font-size:16px;color:var(--mut);max-width:560px;margin:0 auto;}
.cert-foot{margin-top:26px;font-size:13.5px;color:var(--faint);}
.cert-input{border:1.5px solid var(--line);border-radius:11px;padding:12px 16px;font-size:16px;width:320px;max-width:100%;}
@media print{.side,.pager,.cert-formrow,.crumb,.cert-intro{display:none!important;} .main{padding:0!important;} body{background:#fff;}}
@media(max-width:980px){
 .role-mini{grid-template-columns:1fr;}
 .hero{padding:26px 22px;}
}
.app{display:flex;min-height:100vh;}
.side{width:320px;flex:0 0 320px;background:#fff;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;overflow:auto;}
.brand{font-size:17px;font-weight:700;line-height:1.3;}
.brand-sub{font-size:13px;color:var(--mut);margin-top:6px;}
.prog-wrap{margin:18px 0 8px;}
.prog-bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .4s ease;}
.prog-label{font-size:13px;color:var(--mut);margin-top:8px;}
.nav{margin-top:12px;display:flex;flex-direction:column;gap:4px;}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-size:15px;color:var(--mut);cursor:pointer;}
.nav button:hover{background:var(--soft);}
.nav button.on{background:var(--soft);color:var(--ink);font-weight:600;}
.nav .mdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;}
.nav .tick{margin-left:auto;font-size:13px;font-weight:700;color:var(--green);}
.nav .sep{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px;font-weight:600;}
.side-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--faint);line-height:1.5;}
.side-foot a{color:var(--mut);cursor:pointer;text-decoration:underline;}
.main{flex:1;padding:38px 48px 90px;max-width:1560px;width:100%;}
.crumb{font-size:14px;color:var(--faint);font-weight:500;}
h1{font-size:clamp(30px,2.4vw,44px);font-weight:750;margin:8px 0 0;line-height:1.15;letter-spacing:-.01em;}
.goal{margin-top:16px;padding:16px 20px;border-radius:14px;font-size:16.5px;border-left:5px solid var(--acc,#2f6bd8);background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.goal b{font-weight:700;}
h2.sec{font-size:19px;font-weight:700;margin:34px 0 6px;}
.topic{padding:20px 0 22px;border-bottom:1px solid var(--line);max-width:1080px;}
.topic h3{font-size:20px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px;}
.topic h3 .tnum{flex:0 0 28px;height:28px;border-radius:8px;background:var(--accBg,#eaf2fe);color:var(--acc,#2f6bd8);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.topic p{font-size:16.5px;color:var(--mut);margin:10px 0 0;}
.practice{margin-top:30px;border-radius:16px;padding:20px 24px;background:var(--amberBg);border:1.5px dashed #f0d9ab;}
.practice .pl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);}
.practice p{font-size:16.5px;margin:8px 0 0;}
/* ---- quiz ---- */
.quiz{margin-top:34px;}
.q-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.q-dots{display:flex;gap:6px;}
.q-dot{width:12px;height:12px;border-radius:50%;background:#dfe3ec;border:2px solid #dfe3ec;}
.q-dot.cur{border-color:var(--acc,#2f6bd8);background:#fff;}
.q-dot.ok{background:var(--green);border-color:var(--green);}
.q-dot.bad{background:var(--red);border-color:var(--red);}
.q-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.mini-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--mut);cursor:pointer;}
.mini-btn:hover:not(:disabled){background:var(--soft);color:var(--ink);}
.mini-btn:disabled{opacity:.45;cursor:default;}
.q{border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-top:14px;background:#fff;}
.q-text{font-size:17px;font-weight:650;margin:0;}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 16px;font-size:16px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s;}
.opt:hover:not(:disabled){border-color:var(--acc,#2f6bd8);background:var(--accBg,#eaf2fe);}
.opt:disabled{cursor:default;}
.opt.ok{border-color:var(--green);background:var(--greenBg);}
.opt.bad{border-color:var(--red);background:var(--redBg);}
.q-exp{font-size:15.5px;color:var(--mut);margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);}
.q-exp b{color:var(--ink);}
.review{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:#fff;display:none;}
.review.open{display:block;}
.review .rv-head{padding:16px 24px;border-bottom:1px solid var(--line);font-size:16px;font-weight:700;}
.rv-item{padding:14px 24px;border-bottom:1px solid var(--line);font-size:15px;}
.rv-item:last-child{border-bottom:0;}
.rv-st{font-weight:700;margin-right:8px;}
.rv-st.ok{color:var(--green);} .rv-st.bad{color:var(--red);}
.rv-q{font-weight:650;color:var(--ink);}
.rv-a{color:var(--mut);margin-top:4px;}
.rv-a .va{color:var(--green);font-weight:600;} .rv-a .ya{color:var(--red);font-weight:600;}
.rv-e{color:var(--mut);margin-top:6px;padding:10px 14px;background:var(--soft);border-radius:10px;font-size:14.5px;}
.banner{display:none;margin-top:22px;padding:18px 24px;border-radius:14px;background:var(--greenBg);border:1.5px solid #bfe6cf;font-size:16.5px;font-weight:650;color:#14663a;align-items:center;gap:12px;}
.banner.show{display:flex;}
.banner .bcheck{width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 30px;}
/* ---- bottom nav ---- */
.pager{display:flex;justify-content:space-between;gap:14px;margin-top:44px;flex-wrap:wrap;}
.pg-btn{border:0;border-radius:12px;padding:14px 26px;font-size:16px;font-weight:650;cursor:pointer;background:var(--ink);color:#fff;}
.pg-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.pg-btn:disabled{background:#e3e6ee;color:var(--faint);cursor:not-allowed;}
.pg-lock{width:100%;font-size:14px;color:var(--faint);margin-top:10px;display:flex;align-items:center;gap:8px;}
.pg-lock.open{color:var(--green);font-weight:600;}
/* ---- viz ---- */
.viz-card{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 28px;box-shadow:0 3px 16px rgba(30,40,80,.05);}
.viz-title{font-size:16.5px;font-weight:750;display:flex;align-items:center;gap:10px;}
.viz-title .vt-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;}
.viz-sub{font-size:14px;color:var(--faint);margin:6px 0 0 44px;}
.viz-body{margin-top:18px;}
.viz-panel{background:var(--soft);border-radius:14px;padding:16px 20px;font-size:15.5px;color:var(--mut);min-height:96px;}
.viz-panel b{color:var(--ink);}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.role-card{border:2px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;background:#fff;transition:border-color .15s,transform .15s;}
.role-card:hover{transform:translateY(-2px);}
.role-card.sel{border-color:var(--rc);background:var(--rcBg);}
.role-card .rc-name{font-size:16px;font-weight:700;color:var(--rc);}
.role-card .rc-q{font-size:13.5px;color:var(--mut);margin-top:6px;font-style:italic;}
.chip-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.fchip{border:2px solid var(--fc,#2f6bd8);background:#fff;color:var(--fc,#2f6bd8);border-radius:999px;padding:9px 20px;font-size:15.5px;font-weight:700;cursor:pointer;}
.fchip.sel{background:var(--fc);color:#fff;}
.farrow{font-size:20px;color:var(--faint);font-weight:700;}
.layer-stack{display:flex;flex-direction:column;gap:0;align-items:center;}
.layer{border-radius:12px;padding:14px 20px;text-align:center;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.layer:hover{transform:scale(1.02);}
.layer .ln{font-weight:750;font-size:15.5px;}
.layer .ls{font-size:13px;opacity:.85;}
.layer-arrow{color:var(--faint);font-size:16px;line-height:1.2;}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.qchip{border:2px solid var(--qc);background:var(--qcBg);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:center;}
.qchip .qn{font-weight:700;color:var(--qc);font-size:15px;}
.qchip.sel{box-shadow:0 0 0 2px var(--qc) inset;}
.pipe{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;}
.pnode{border:2px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;text-align:center;cursor:pointer;min-width:120px;transition:all .2s;}
.pnode .pn{font-weight:700;font-size:14.5px;}
.pnode .ps{font-size:12px;color:var(--mut);margin-top:2px;}
.pnode.hot{border-color:var(--nc);background:var(--ncBg);transform:scale(1.05);box-shadow:0 4px 14px rgba(30,40,80,.12);}
.parrow{align-self:center;color:var(--faint);font-size:18px;padding:0 8px;font-weight:700;}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;}
.seg button{border:0;background:#fff;padding:9px 18px;font-size:14.5px;font-weight:600;color:var(--mut);cursor:pointer;}
.seg button.on{background:var(--ink);color:#fff;}
.tok{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16.5px;padding:3px 8px;border-radius:7px;cursor:pointer;border:1.5px solid transparent;line-height:2;}
.tok:hover{border-color:currentColor;}
.mini-table{border-collapse:collapse;font-size:14.5px;margin-top:10px;}
.mini-table th,.mini-table td{border:1px solid var(--line);padding:7px 16px;text-align:left;}
.mini-table th{background:var(--soft);font-weight:650;}
.bars{display:flex;align-items:flex-end;gap:10px;height:220px;padding:10px 6px 0;border-bottom:2px solid var(--line);}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bval{font-size:13px;font-weight:700;margin-bottom:4px;}
.bbar{width:46px;border-radius:6px 6px 0 0;}
.blab{font-size:13px;color:var(--mut);margin-top:6px;}
.mline{position:relative;border-top:2.5px dashed;}
.abwrap{display:flex;align-items:flex-end;gap:60px;height:240px;padding:0 20px;border-bottom:2px solid var(--line);}
.vert{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
.whisk{width:2px;background:var(--ink);position:relative;}
.whisk::before,.whisk::after{content:"";position:absolute;left:-8px;width:18px;height:2px;background:var(--ink);}
.whisk::before{top:0;} .whisk::after{bottom:0;}
input[type=range]{width:100%;accent-color:var(--purple);}
:focus-visible{outline:2.5px solid var(--purple);outline-offset:2px;border-radius:6px;}
.main:focus{outline:none;}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;z-index:10000;}
.skip:focus{left:8px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mut);}
.legend .li{display:flex;align-items:center;gap:6px;cursor:pointer;}
.legend .sw{width:14px;height:4px;border-radius:2px;}
.mat2x2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.quad{border:2px solid var(--qc);background:var(--qcBg);border-radius:14px;padding:16px 18px;cursor:pointer;min-height:110px;}
.quad.sel{box-shadow:0 0 0 2px var(--qc) inset;}
.quad .qn{font-weight:750;font-size:15.5px;color:var(--qc);}
.quad .qd{font-size:13.5px;color:var(--mut);margin-top:6px;}
.bricks{display:flex;gap:8px;flex-wrap:wrap;min-height:56px;align-items:flex-end;}
.brick{width:52px;height:34px;border-radius:7px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:rotate(var(--rot,0deg));}
.meter{height:16px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:14px;}
.meter-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));width:0%;transition:width .3s;}
.vbtn{border:0;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;}
.vbtn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.g-search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 18px;font-size:16px;margin-top:18px;background:#fff;color:var(--ink);}
.g-search::placeholder{color:var(--faint);}
.g-wrap{overflow-x:auto;margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 22px 14px;}
table{width:100%;border-collapse:collapse;min-width:680px;}
th{font-size:13px;font-weight:650;color:var(--faint);text-align:left;padding:14px 14px 10px 0;border-bottom:1.5px solid var(--line);white-space:nowrap;}
td{font-size:15.5px;color:var(--mut);padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:top;}
td.term{color:var(--ink);font-weight:700;white-space:nowrap;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;}
.ck-item{display:flex;gap:14px;align-items:flex-start;padding:16px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;}
.ck-item input{margin-top:4px;accent-color:var(--green);width:20px;height:20px;flex:0 0 20px;cursor:pointer;}
.ck-item span{font-size:17px;}
.ck-item input:checked + span{color:var(--faint);text-decoration:line-through;}
.ck-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 26px 18px;margin-top:18px;}
.ck-top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px;font-weight:700;font-size:16px;}
.empty{font-size:15.5px;color:var(--faint);padding:20px 0;}
@media(max-width:980px){
 .app{flex-direction:column;}
 .side{width:100%;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);}
 .nav{flex-direction:row;overflow-x:auto;}
 .nav .sep{display:none;}
 .nav button{white-space:nowrap;flex:0 0 auto;}
 .main{padding:22px 18px 60px;}
 .role-grid,.qgrid{grid-template-columns:1fr;}
 .mat2x2{grid-template-columns:1fr;}
}
</style>
</head>
<body>

 {num:1,short:'Карта мира данных',title:'Карта мира данных: кто есть кто в команде',dur:'90 мин',
  goal:'Понять, кто есть кто в команде данных, и научиться формулировать задачи через управленческий вопрос, а не через "выгрузку".',
  topics:[
   {t:'Три роли в команде данных',d:'Команда данных это разные профессии с разными инструментами и вопросами. <br>Руководитель проекта не должен уметь делать их работу, но обязан понимать, к кому идти с какой задачей, иначе задача будет бесконечно переадресовываться.'},
   {t:'Место руководителя проектов в цепочке',d:'Руководитель проекта это заказчик и переводчик, превращающий управленческую цель в аналитический вопрос, принимает решение по результату и защищает время команды на качество данных. <br>Если РП просит "выгрузку ради выгрузки", команда тратит часы на данные, которые никуда не приведут.'},
   {t:'Формула постановки задачи',d:'Хорошая задача аналитику пишется по формуле из четырех шагов. <br>Ниже интерактив: нажимайте на шаги и смотрите, как "выгрузите заявления" превращается в задачу, которую не придется переделывать три раза.'}
  ],
  practice:'Возьмите одну реальную задачу на ближайшую неделю (например, разобраться, почему в одном районе дольше согласовывают заявления). <br>Перепишите ее в формате "контекст → вопрос → решение → формат результата". Покажите аналитику и спросите: "Чего я не учел?"',
  quiz:[
   {q:'Кому в команде данных поставить задачу "настроить ежедневную автоматическую выгрузку заявлений из информационной системы в хранилище"?',
    o:['Аналитику данных','Дата-инженеру','Владельцу данных','Руководителю проекта самому, в Excel'],a:1,
    e:'Автоматизация потоков данных это зона ответственности дата-инженера. Аналитик работает поверх готовых данных, а владелец данных несет ответственность за их качество и смысл.'},
   {q:'С чего начинается хорошая постановка задачи аналитику?',
    o:['С перечня нужных колонок','С управленческого вопроса и решения, которое примем','С готового SQL-запроса','С требования "сделать к утру"'],a:1,

    o:['"Как спроектировать хранилище?"','"Что происходит и почему?"','"Полные ли данные и что на самом деле означает статус заявления?"','"Как настроить доступы к данным?"'],a:1,
    e:'Аналитик отвечает на вопросы "что происходит и почему". За хранилище и техническую настройку доступов — инженеры, за полноту и смысл данных и согласование доступов — владелец данных.'}
  ]},
 {num:2,short:'Как устроены данные',title:'Как устроены данные',dur:'90 мин',
  goal:'Уметь разбираться в структуре данных: строки, столбцы, типы, ключи, слои сырых и обработанных данных. Понимать, что такое качество данных.',
  topics:[
   {t:'Строки, столбцы, типы данных',d:'Каждая строка это объект: заявление, факт оплаты, здание, а каждый столбец это его свойство. <br>Тип данных (число, текст, дата) определяет, что можно делать с данными: "двенадцать штук" как цифру не посчитаешь. <br>Ключ это поле, которое однозначно определяет строку, например номер заявления или ID объекта.'},
   {t:'Сырые и обработанные данные',d:'Данные проходят через слои, как по конвейеру: как пришли из информационной системы → почищенные → готовые к отчетам. <br>Главное правило инженеров: исходную выгрузку не трогаем никогда.'},
   {t:'Качество данных',d:'Пропуски, дубликаты и выбросы — три врага любой цифры. <br>У дата-инженеров есть четыре постоянные проверки качества. Нажимайте на карточки, чтобы увидеть описание проверок.'}
  ],
  practice:'Составьте чек-лист качества для данных вашего проекта (например, реестра заявлений): полнота, уникальность, актуальность, консистентность. <br>Отметьте, какие проверки сегодня делаются "на глаз", а какие не делает никто.',
  quiz:[

    e:'Слои bronze → silver → gold. Исходную выгрузку трогать нельзя, потому что это страховка и возможность все пересчитать заново.'},

   {q:'Что в первую очередь искажают дубликаты строк в выгрузке заявлений?',

 {num:3,short:'Путь данных',title:'Путь данных: от информационной системы до дашборда руководителю',dur:'90 мин',
  goal:'Видеть цепочку "источник → пайплайн → хранилище → витрина → дашборд" и понимать, почему "просто взять данные" может занять дни.',
  topics:[
   {t:'Источники данных',d:'Файлы и выгрузки (Excel, CSV,...), API (запросы к различным информационным системам), базы данных (реестр заявлений, реестр объектов), события (действия заявителей на портале). <br>У каждого источника свой формат, свое расписание обновления и свои проблемы с качеством.'},
   {t:'Пайплайн и ETL',d:'Данные не телепортируются в дашборд, а идут по конвейеру: забрали → почистили → положили в хранилище. <br>Запустите конвейер на схеме и посмотрите, что происходит на каждом шаге.'},
   {t:'Хранилище, озеро, витрина',d:'Это три разных "дома" для данных. Дашборды стоят на витринах, а не на сырых данных и это важно, когда что-то ломается. <br>Нажимайте на карточки.'}
  ],
  practice:'Нарисуйте на листе бумаги схему: источники → пайплайн → хранилище → витрина → дашборд — для вашего проекта. <br>Подпишите, кто отвечает за каждый участок. Покажите инженеру и попросите поправить.',

    o:['Сырые логи событий портала','Готовые к отчетам обработанные наборы','Программа для построения графиков','Архив сырых логов портала'],a:1,

    o:['Дата-инженера','Дизайнера','Руководителя комиссии','Аналитика, который рисовал дашборд'],a:0,
    e:'Сначала проверяется пайплайн: загрузка, расписание, логи. К аналитику, если данные в витрине корректны, а проблема в расчетах дашборда.'}
  ]},
 {num:4,short:'SQL без кода',title:'SQL это язык данных',dur:'90 мин',

   {t:'JOIN это склейка таблиц',d:'Аналог ВПР, но мощнее: объединяет строки двух таблиц по общему ключу, например номер заявления или id заявителя. <br>LEFT JOIN сохраняет все строки левой таблицы даже без пары справа и это важно, чтобы не потерять данные.'},

 {num:5,short:'Метрики и статистика',title:'Метрики и статистика, которой не страшно доверять',dur:'90 мин',
  goal:'Не обманываться цифрами: среднее и медиана, база сравнения, взаимосвязи против причинности, правильные вопросы про сравнение вариантов',
  topics:[
   {t:'Среднее против медианы',d:'Среднее чувствительно к выбросам. Проверьте сами: нажмите кнопку на схеме и добавьте одно заявление, застрявшее на согласовании аномально долго и посмотрите, какая линия "прыгнет", а какая останется стоять на месте.'},

   {t:'Корреляция ≠ причинность',d:'Число выданных разрешений на строительство и число жалоб на нехватку парковок растут одновременно. <br>Совпадение трендов само по себе ничего не доказывает. Включите третью линию на графике и все встанет на свои места.'}
  ],
  practice:'Найдите три числа из последнего отчета по вашему проекту. По каждому ответьте: от какой базы считался процент, что со средним и медианой, может ли здесь быть выброс или сторонний фактор.',
  quiz:[
   {q:'Одно заявление, простоявшее на согласовании 250 дней из-за сложной экспертизы, резко подняло "средний срок согласования". Что смотреть?',

    e:'Два показателя могут расти вместе из-за третьего фактора. Чтобы доказать влияние, нужен эксперимент или контроль причин.'},
   {q:'В отчете написано: "конверсия выросла на 100%". Что сделать в первую очередь?',

    e:'Рост на 100% от 0,1% это всего 0,2%. Сначала смотрим абсолютные значения и базу сравнения и только потом делаем выводы.'}

 {num:6,short:'Отчеты и дашборды',title:'Отчетность и дашборды',dur:'90 мин',
  goal:'Различать отчет, дашборд и ad-hoc анализ, понимать, откуда дашборды берут цифры, и не позволять визуализации врать.',
  topics:[

   {t:'BI и витрины',d:'Дашборд не "хранит" данные: он читает их из витрины. Сломайте витрину на схеме переключателем и посмотрите, что произойдет со всеми дашбордами сразу, включая панель по срокам согласования.'},

  quiz:[

   {q:'Как не соврать графиком по срокам согласования?',

    e:'Три простых правила: ось с нуля, единицы на подписях, без декоративного 3D.'}
  ]},
 {num:7,short:'Процессы и команда',title:'Процессы: работа с командой данных',dur:'90 мин',

   {t:'Приоритизация и расписание обновлений',d:'Оценивайте задачи по ценности решения и срочности, а не по громкости заказчика. Матрица ниже показывает четыре квадранта, нажимайте на них и смотрите правила.'},

  quiz:[
   {q:'Техдолг данных — это:',

var KEY='pmDataCourseUrbanV1';
var state={done:{},quiz:{},check:{},practice:{},certName:''};
try{var s=localStorage.getItem(KEY);if(s){var loaded=JSON.parse(s);for(var k in loaded)state[k]=loaded[k];}}catch(e){}
Object.keys(state.quiz).forEach(function(k){var v=state.quiz[k];
 if(typeof v==='number'){var p=k.split('-'),mq=MODULES[+p[0]],qq=mq&&mq.quiz[+p[1]];if(qq)state.quiz[k]={c:v,ok:v===qq.a};else delete state.quiz[k];}});

var N_MOD=MODULES.length;

function completeModule(mi){
 if(!state.done['m'+mi]){state.done['m'+mi]=true;save();buildNav();updateProgress();}
}
function goNext(mi){completeModule(mi);current=ORDER[ORDER.indexOf('m'+mi)+1];buildNav();render();}
function allCorrect(mi){
 var m=MODULES[mi];
 return m.quiz.every(function(q,qi){var a=state.quiz[mi+'-'+qi];return a&&a.ok;});
}
function quizStats(mi){
 var m=MODULES[mi],ok=0,wrong=0;
 m.quiz.forEach(function(q,qi){var a=state.quiz[mi+'-'+qi];if(a){if(a.ok)ok++;else wrong++;}});
 return {ok:ok,wrong:wrong,total:m.quiz.length};
}
function getXP(){
 var xp=0;
 MODULES.forEach(function(m,i){
  m.quiz.forEach(function(q,qi){var a=state.quiz[i+'-'+qi];if(a&&a.ok)xp+=10;});
  if(state.done['m'+i])xp+=40;
  if(state.practice[i])xp+=10;
 });
 return xp;
}
function doneCount(){return MODULES.filter(function(m,i){return state.done['m'+i];}).length;}

 var n=doneCount(),totalXP=getXP(),maxXP=MODULES.reduce(function(a,m){return a+m.quiz.length*10+40+10;},0);
 var target=n===N_MOD?'m0':nextTarget();
 var h='<div class="crumb">Главная · курс для руководителей проектов</div>';
 h+='<div class="hero"><div class="hero-kicker">Интерактивный курс</div>';
 h+='<h1>Данные для руководителя проекта</h1>';
 h+='<p class="lead">Короткий практический курс о том, как понимать команду данных, ставить задачи аналитику, дата-инженеру и не путаться в терминах. <br>Без программирования, на примерах из работы организации.</p>';
 h+='<div class="hero-stats">';
 h+='<div class="hero-stat"><b>'+N_MOD+'</b><span>модулей</span></div>';
 h+='<div class="hero-stat"><b>'+hoursLabel()+'</b><span>в своем темпе</span></div>';
 h+='<div class="hero-stat"><b>'+n+' / '+N_MOD+'</b><span>пройдено</span></div>';
 h+='<div class="hero-stat"><b>'+totalXP+'</b><span>XP из '+maxXP+'</span></div>';
 h+='</div>';
 h+='<div class="hero-cta"><button class="pg-btn" id="startBtn">'+(n===0?'Начать курс →':(n===N_MOD?'Повторить материал →':'Продолжить: модуль '+(+target.slice(1)+1)+' →'))+'</button><span style="font-size:13.5px;color:var(--mut)">Прогресс сохраняется в браузере, можно проходить курс по частям.</span></div>';
 h+='</div>';
 h+='<h2 class="sec">С кем вы работаете</h2>';
 h+='<div class="role-mini">';
 h+='<div class="rm-card"><div class="rm-ico" style="background:'+PAL.blueBg+';color:'+PAL.blue+'">📊</div><b>Аналитик данных</b><p>Отвечает "что происходит и почему": метрики, отчеты, разовые разборы.</p></div>';
 h+='<div class="rm-card"><div class="rm-ico" style="background:'+PAL.greenBg+';color:'+PAL.green+'">⚙️</div><b>Дата-инженер</b><p>Следит, чтобы данные были, приходили вовремя и были правильными.</p></div>';
 h+='<div class="rm-card"><div class="rm-ico" style="background:'+PAL.purpleBg+';color:'+PAL.purple+'">📚</div><b>Владелец данных</b><p>Отвечает за полноту, актуальность и понятность данных: кто их вносит и что означает каждое поле.</p></div>';
 h+='</div>';
 h+='<h2 class="sec">Модули курса</h2>';
 h+='<div class="mod-grid">';
 MODULES.forEach(function(m,i){
  var st=quizStats(i),done=state.done['m'+i],frac=st.total?Math.round((st.ok/st.total)*100):0;
  var stateLbl=done?'Пройден':(st.ok+st.wrong>0?'В процессе':'Не начат');
  var stateBg=done?PAL.greenBg:(st.ok+st.wrong>0?PAL.amberBg:'var(--soft)');
  var stateCol=done?PAL.green:(st.ok+st.wrong>0?PAL.amber:'var(--faint)');
  h+='<button class="mod-card" data-k="m'+i+'"><div class="mc-top"><div class="mc-num" style="background:'+HUESBG[i]+';color:'+HUES[i]+'">'+m.num+'</div><span class="mc-state" style="background:'+stateBg+';color:'+stateCol+'">'+stateLbl+'</span></div>';
  h+='<div class="mc-title">'+MICO[i]+' '+m.short+'</div><div class="mc-sub">'+m.dur+' · '+m.quiz.length+' вопроса</div>';
  h+='<div class="mc-bar"><i style="width:'+frac+'%;background:'+HUES[i]+'"></i></div></button>';
 });
 h+='</div>';
 h+='<div class="badge-row" style="margin-top:26px">';
 MODULES.forEach(function(m,i){
  var on=state.done['m'+i];
  h+='<span class="badge'+(on?' on':'')+'" style="'+(on?'background:'+HUESBG[i]+';color:'+HUES[i]:'')+'" title="'+m.short+'">'+MICO[i]+'</span>';
 });
 h+='</div><div class="streak-note">Бейдж открывается, когда вы верно отвечаете на все вопросы модуля.</div>';
 main.innerHTML=h;
 document.getElementById('startBtn').onclick=function(){current=target;buildNav();render();};
 main.querySelectorAll('.mod-card').forEach(function(b){b.onclick=function(){current=b.dataset.k;buildNav();render();};});
}
/* ================= certificate ================= */
function renderCert(){
 var n=doneCount(),complete=n===N_MOD;
 var h='<div class="crumb">Выпускной документ</div><h1 class="cert-intro">Сертификат о прохождении курса</h1><div class="cert-wrap">';
 if(!complete){
  h+='<p class="cert-intro" style="color:var(--mut);font-size:16.5px;margin-top:10px;max-width:640px">Сертификат открывается после успешного прохождения всех '+N_MOD+' модулей. Сейчас пройдено <b>'+n+' из '+N_MOD+'</b>. Осталось совсем немного!</p>';
  h+='<div class="prog-bar cert-intro" style="max-width:420px;margin-top:14px"><div class="prog-fill" style="width:'+(n/N_MOD*100)+'%"></div></div>';
 }else{
  h+='<p class="cert-intro" style="color:var(--mut);font-size:16.5px;margin-top:10px;max-width:640px">Поздравляем — все модули пройдены! Впишите имя и распечатайте или сохраните сертификат в PDF (через печать браузера).</p>';
 }
 h+='<div class="cert-formrow" style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">';
 h+='<input class="cert-input" id="certName" placeholder="Фамилия Имя" value="'+(state.certName||'').replace(/"/g,'&quot;')+'">';
 if(complete)h+='<button class="pg-btn ghost" id="printBtn">🖨 Распечатать / сохранить PDF</button>';
 h+='</div>';
 h+='<div class="cert'+(complete?' pop':'')+'" style="'+(complete?'':'filter:grayscale(.75);opacity:.55')+'">';
 h+='<div class="cert-kicker">Сертификат о прохождении курса</div>';
 h+='<div style="font-size:19px;font-weight:700;margin-top:14px">"Данные для руководителя проекта"</div>';
 h+='<div class="cert-name" id="certNameOut">'+((state.certName||'').trim()||'Ваше имя')+'</div>';
 h+='<div class="cert-sub">успешно прошел(-ла) курс о работе с данными: роли команды, устройство данных, SQL без кода, метрики и статистика, отчетность и дашборды, процессы работы с командой.</div>';
 h+='<div class="cert-foot">'+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+' · '+getXP()+' XP · '+N_MOD+' из '+N_MOD+' модулей</div>';
 h+='</div></div>';
 var idx=ORDER.indexOf('cert');
 h+='<div class="pager"><button class="pg-btn ghost" id="pgPrev">← '+pageName(ORDER[idx-1])+'</button><span></span></div>';
 main.innerHTML=h;
 var nameInput=document.getElementById('certName');
 nameInput.oninput=function(){state.certName=this.value;save();document.getElementById('certNameOut').textContent=this.value.trim()||'Ваше имя';};
 var pb=document.getElementById('printBtn');if(pb)pb.onclick=function(){window.print();};
 document.getElementById('pgPrev').onclick=function(){current=ORDER[idx-1];buildNav();render();};
}

/* ================= render root ================= */
function render(){
 if(current==='home')renderHome();
 else if(current==='gloss')renderGlossary();
 else if(current==='check')renderChecklist();
 else if(current==='cert')renderCert();
 else renderModule(+current.slice(1));
 window.scrollTo(0,0);
 main.focus({preventScroll:true});
 main.classList.remove('fadein');void main.offsetWidth;main.classList.add('fadein');
}
document.getElementById('resetLink').onclick=function(e){
 e.preventDefault();
 if(confirm('Сбросить весь прогресс курса?')){
  state={done:{},quiz:{},check:{},practice:{},certName:''};save();current='home';buildNav();updateProgress();render();
 }
};
buildNav();updateProgress();render();
</script>
</body>
</html>
